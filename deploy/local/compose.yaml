# Stack local tạm (chưa có VPS): nginx gốc ở http://localhost:8180
#  - Next standalone chạy trên máy: 127.0.0.1:3010 (deploy/local/start-next.sh)
#  - WordPress: wordpress/compose.yaml (nginx riêng 127.0.0.1:8089)
name: haivan-local
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8180:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HV_SERVER_NAME: "localhost haivan.com"
      HV_HOST_REGEX: '^(localhost|haivan\.com)(:[0-9]+)?$'
      HV_NEXT_UPSTREAM: "host.docker.internal:3010"
      HV_WP_UPSTREAM: "host.docker.internal:8089"
      HV_HSTS_MAX_AGE: "300"   # local là http nên không phát; production tăng dần tới 31536000
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ../nginx/conf.d/haivan.conf.template:/etc/nginx/templates/conf.d/haivan.conf.template:ro
      - ../nginx/conf.d/wp-locations.inc:/etc/nginx/conf.d/wp-locations.inc:ro
      - ../nginx/hv-next-proxy.conf:/etc/nginx/hv-next-proxy.conf:ro
      - ../nginx/hv-next-api.conf:/etc/nginx/hv-next-api.conf:ro
      - ../nginx/hv-wp-proxy.conf:/etc/nginx/hv-wp-proxy.conf:ro
      - ../nginx/hv-wp-cache.conf:/etc/nginx/hv-wp-cache.conf:ro
      - ../nginx/hv-security-headers.conf:/etc/nginx/hv-security-headers.conf:ro
      - ../nginx/hv-server-common.inc:/etc/nginx/hv-server-common.inc:ro
      - ./empty.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
