proxy_http_version 1.1;
proxy_set_header Connection "";
# $http_host giữ cổng (local :8180) để WP/Next sinh URL tuyệt đối đúng.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# Next nhận IP thật từ nginx, không nối chuỗi XFF do client gửi (bộ đếm OTP theo IP).
proxy_set_header X-Forwarded-For $remote_addr;
# Header nội bộ của proxy.ts: client không được tự đặt.
proxy_set_header X-HV-Rewritten "";
proxy_set_header X-Forwarded-Proto $scheme;
proxy_redirect off;
proxy_read_timeout 60s;
# Header bảo mật do nginx gốc phát (hv-security-headers.conf): bỏ bản của upstream để không lặp.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
