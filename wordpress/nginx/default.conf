# nginx riêng của WordPress (php-fpm). Nginx gốc (deploy/) proxy tới đây; local: http://localhost:8089
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 40m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Không thêm "/" cuối: permalink /%postname% không redirect hàng loạt.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Chặn file cấu hình/nhạy cảm KHÔNG phân biệt hoa thường (bind mount macOS không phân biệt hoa thường nên
    # /wp-config.PHP trỏ tới đúng file wp-config.php). Các khối regex này phải đứng TRƯỚC khối PHP: nginx lấy regex khớp đầu tiên.
    location ~* ^/wp-content/uploads/.*\.php$ { return 403; }
    location ~ /\.(?!well-known) { deny all; }                           # .git, .env, .htaccess, .htpasswd...
    location ~* /\.ht { deny all; }
    location ~* ^/wp-config { return 404; }                               # wp-config.php, wp-config-sample.php, wp-config.php.bak
    location ~* ^/(?:readme\.html|license\.txt|wp-admin/install\.php)$ { return 404; }
    location ~* \.(?:sql|sql\.gz|log|bak|old|orig|save|swp|ini|conf|env|dist)$ { return 404; }   # dump DB, log, bản sao lưu, cấu hình
    location ~* ^/xmlrpc\.php$ { return 403; }

    location ~* \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass wordpress:9000;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.php$is_args$args;
    }
}
