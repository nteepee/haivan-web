# Các location chuyển tiếp tới WordPress cho nginx gốc (deploy/, phase 10).
#
# 1) Trong khối http { } của nginx gốc khai báo upstream (một trong hai):
#      upstream hv_wordpress { server host.docker.internal:8089; keepalive 16; }   # WP chạy bằng wordpress/compose.yaml trên máy chủ
#      upstream hv_wordpress { server haivan-wp-nginx-1:80;      keepalive 16; }   # cùng docker network với compose của WP
# 2) Trong server { } của haivan.com: các location của Next (/xe-khach, /tai-khoan, /partner, /tracking,
#    /_next, /api/hv, và bản /en/ của chúng) đặt TRƯỚC; rồi `include` file này (đặt cuối).
#    Mọi đường dẫn còn lại (/, /en/, /chung-toi/**, /dich-vu/**, /chinh-sach/**, /ho-tro/**, /diem-den/**,
#    /uu-dai/**, /tuyen-duong/**, /haivanplus, /dat-ve-nhanh*, /wp-json/**, sitemap) đi vào `location /` bên dưới.
# 3) WP_URL trong wordpress/.env phải trùng origin công khai (vd. https://haivan.com) để WP sinh URL đúng.
#
# Không thêm "/" cuối: WP dùng permalink /%postname% (không dấu "/" cuối). Đừng bật `merge_slashes off`
# hay rewrite thêm "/" ở nginx gốc, sẽ sinh redirect hàng loạt.

# Cấu hình proxy dùng chung (include lại trong từng location bên dưới).
# Lưu ý: add_header/proxy_set_header trong location sẽ ghi đè cấp cha, nên lặp lại ở đây.

# --- Quản trị: giới hạn IP (đổi dải cho phù hợp; production nên dùng thêm host riêng + 2FA) -------------
# Chỉ liệt kê IP văn phòng/VPN thật của MKT. KHÔNG allow 10/8, 172.16/12, 192.168/16: sau docker-proxy/LB/CDN mọi request
# đều tới từ IP riêng nên allowlist đó cho phép tất cả (cần real_ip_header nếu có CDN/LB phía trước).
# ~* : không phân biệt hoa thường (wp-login.PHP), cùng lý do với wordpress/nginx/default.conf.
location ~* ^/wp-login\.php$ {
    allow 127.0.0.1;
    allow ::1;
    # allow 203.0.113.10;     # IP văn phòng / VPN của MKT
    deny all;
    include /etc/nginx/hv-wp-proxy.conf;   # hoặc dán 6 dòng proxy_* của khối "location /" xuống đây
    proxy_pass http://hv_wordpress;
}
location /wp-admin/ {
    # admin-ajax.php / admin-post.php phải mở cho khách (plugin front-end dùng); phần còn lại giới hạn IP.
    # Location lồng nhau KẾ THỪA allow/deny của cha: bắt buộc `allow all;` để mở thật sự.
    location ~* ^/wp-admin/admin-ajax\.php$ { allow all; include /etc/nginx/hv-wp-proxy.conf; proxy_pass http://hv_wordpress; }
    location ~* ^/wp-admin/admin-post\.php$ { allow all; include /etc/nginx/hv-wp-proxy.conf; proxy_pass http://hv_wordpress; }
    allow 127.0.0.1;
    allow ::1;
    # allow 203.0.113.10;
    deny all;
    include /etc/nginx/hv-wp-proxy.conf;
    proxy_pass http://hv_wordpress;
}
location ~* ^/xmlrpc\.php$ { return 403; }
# File cấu hình/nhạy cảm (không phân biệt hoa thường), đứng trước `location /`:
location ~* ^/wp-config { return 404; }
location ~* ^/(?:readme\.html|license\.txt)$ { return 404; }
location ~* \.(?:sql|sql\.gz|log|bak|old|orig|save|swp|ini|conf|env|dist)$ { return 404; }
location ~ /\.(?!well-known) { deny all; }

# --- REST công khai (layout cho Next: cache 1 giờ do WP đặt Cache-Control) -----------------------------
location /wp-json/ {
    include /etc/nginx/hv-wp-proxy.conf;
    proxy_pass http://hv_wordpress;
}

# --- Tất cả còn lại -> WordPress -----------------------------------------------------------------------
location / {
    include /etc/nginx/hv-wp-proxy.conf;
    proxy_pass http://hv_wordpress;
}

# Nội dung file /etc/nginx/hv-wp-proxy.conf (hoặc nhúng thẳng vào từng location):
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_redirect off;
#   proxy_read_timeout 120s;
