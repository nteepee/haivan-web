# Page cache cho HTML WordPress ẩn danh (location / của WP). Quy tắc bỏ qua cache: map $hv_wp_nocache trong nginx.conf.
# Key bỏ query string (utm_*/fbclid/gclid dùng chung một bản); query khác đã bị bypass nên không bao giờ vào cache.
proxy_cache hv_wp;
proxy_cache_key "$scheme$host$uri";
proxy_cache_bypass $hv_wp_nocache;
proxy_no_cache $hv_wp_nocache $hv_wp_cookie_unsafe;
proxy_cache_valid 200 301 5m;
proxy_cache_valid 404 1m;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_ignore_headers Set-Cookie;
proxy_hide_header Cache-Control;
add_header Cache-Control $hv_wp_cc always;
add_header X-Cache-Status $upstream_cache_status always;
include /etc/nginx/hv-security-headers.conf;
