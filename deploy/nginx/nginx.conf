# nginx gốc của haivan.com: chia đường dẫn giữa Next (đặt vé, tài khoản, BFF) và WordPress (còn lại).
user  nginx;
worker_processes  auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 20m;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    # Đăng nhập OTP đi từ IP server tới apigw → giới hạn theo IP người dùng ở đây (go-live blocker).
    limit_req_zone $binary_remote_addr zone=hv_auth:10m rate=10r/m; # verify/register; app còn giới hạn theo SĐT

    # Host hợp lệ (có thể kèm cổng): ${HV_HOST_REGEX}, vd. ^(localhost|haivan\.com)(:[0-9]+)?$
    map $http_host $hv_host_ok {
        default 0;
        "~${HV_HOST_REGEX}" 1;
    }
    # Mọi lệnh gw đi ra từ IP server: chặn dò `bookings/{code}` / spam làm apigw khoá IP server.
    limit_req_zone $binary_remote_addr zone=hv_gw:10m rate=120r/m;

    # ---- Header bảo mật cho HTML (hv-security-headers.conf) --------------------------------------------
    map $upstream_http_content_type $hv_is_html {
        default 0;
        "~*^text/html" 1;
    }
    map $hv_is_html $hv_h_xfo { 1 "SAMEORIGIN"; default ""; }
    map $hv_is_html $hv_h_pp  { 1 "camera=(), microphone=(), geolocation=(self), payment=()"; default ""; }
    # HSTS chỉ phát khi chính nginx này nói TLS ($scheme=https): local http không bao giờ nhận. Bắt đầu bằng max-age ngắn
    # (HV_HSTS_MAX_AGE=300), tăng dần tới 31536000 sau khi HTTPS ổn định ≥ 1 tuần (docs/deployment-guide.md).
    map "$hv_is_html$scheme" $hv_h_hsts { "1https" "max-age=${HV_HSTS_MAX_AGE}"; default ""; }

    # ---- Page cache cho WordPress (hv-wp-cache.conf; chỉ location / của WP, KHÔNG áp cho Next) ----------
    proxy_cache_path /var/cache/nginx/hv_wp levels=1:2 keys_zone=hv_wp:20m max_size=500m inactive=60m use_temp_path=off;
    # Bỏ qua cache: người đăng nhập/mật khẩu bài/người bình luận (+ giỏ hàng nếu có), request có Authorization,
    # query string khác utm_*/fbclid/gclid (?s=, ?p=, ?preview=...), và mọi method khác GET/HEAD.
    map $http_cookie $hv_wp_c_cookie {
        default 0;
        "~*(wordpress_logged_in|wordpress_sec_|wp-postpass_|comment_author_|wp_woocommerce_session_|woocommerce_items_in_cart)" 1;
    }
    map $http_authorization $hv_wp_c_auth { default 1; "" 0; }
    map $args $hv_wp_c_args {
        default 1;
        "" 0;
        "~*^(?:(?:utm_[a-z0-9_]+|fbclid|gclid)=[^&]*)(?:&(?:utm_[a-z0-9_]+|fbclid|gclid)=[^&]*)*&?$" 0;
    }
    map $request_method $hv_wp_c_method { default 1; GET 0; HEAD 0; }
    map "$hv_wp_c_cookie$hv_wp_c_auth$hv_wp_c_args$hv_wp_c_method" $hv_wp_nocache { default 1; "0000" 0; }
    # Không lưu response có Set-Cookie ngoài pll_language (Polylang đặt cookie ngôn ngữ ở mọi trang; cùng URL = cùng giá trị).
    map $upstream_http_set_cookie $hv_wp_cookie_unsafe {
        default 1;
        "" 0;
        "~*^pll_language=" 0;
    }
    # HTML ẩn danh 200 → Cache-Control công khai cho CDN/trình duyệt; còn lại giữ nguyên Cache-Control của WP
    # (kể cả no-store/private: khi WP đã cấm cache thì không bao giờ đè thành public).
    map "$hv_wp_nocache:$status:$upstream_http_content_type:$upstream_http_cache_control" $hv_wp_cc {
        default $upstream_http_cache_control;
        "~*^0:200:text/html[^:]*:(?!.*(?:no-store|no-cache|private))" "public, max-age=0, s-maxage=300, stale-while-revalidate=600";
    }

    upstream hv_next      { server ${HV_NEXT_UPSTREAM}; keepalive 16; }
    upstream hv_wordpress { server ${HV_WP_UPSTREAM};   keepalive 16; }

    include /etc/nginx/conf.d/*.conf;
}
