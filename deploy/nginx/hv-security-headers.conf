# Header bảo mật dùng chung. add_header trong location GHI ĐÈ toàn bộ add_header cấp cha, nên mọi location có
# add_header riêng (Cache-Control...) phải `include` file này. Giá trị rỗng (map trong nginx.conf) = không phát header.
# Các header này do nginx gốc là nguồn duy nhất: hv-*-proxy.conf bỏ bản của upstream để không bị lặp.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options $hv_h_xfo always;
add_header Permissions-Policy $hv_h_pp always;
add_header Strict-Transport-Security $hv_h_hsts always;
